[project]
name = "neural-decoder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cicada-analysis",
    "cicada-nwb",
    "evidently>=0.7.21",
    "fastapi>=0.136.3",
    "matplotlib>=3.7,<=3.10.8",
    "mlflow>=3.13.0",
    "numpy>=2.0,<=2.4.4",
    "pandas>=2.3.3",
    "prefect>=3.7.3",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "uvicorn>=0.49.0",
    "wandb>=0.27.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.uv.sources]
cicada-nwb = { git = "https://gitlab.com/cossartlab/cicada_nwb.git" }
cicada-analysis = { git = "https://gitlab.com/cossartlab/cicada_analysis.git" }
